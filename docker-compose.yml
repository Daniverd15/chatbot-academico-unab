# =====================================================================
#  Chatbot Académico UNAB — despliegue en AWS EC2 (Ubuntu 24.04)
#  n8n (orquestación) + Servidor MCP (FastMCP) + Caddy (HTTPS automático)
#  La base de datos académica y vectorial vive en Supabase (PostgreSQL + pgvector).
# =====================================================================
services:
  postgres-n8n:            # metadatos internos de n8n (workflows, credenciales, ejecuciones)
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes: [n8n_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres-n8n: {condition: service_healthy}
    ports: ["5678:5678"]
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-n8n
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # variables usadas dentro de los workflows ($env.X)
      - MCP_URL=http://mcp-server:9000/mcp
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - CALENDAR_SHEET_CSV_URL=${CALENDAR_SHEET_CSV_URL}
      - APP_API_KEY=${APP_API_KEY}
    volumes: [n8n_data:/home/node/.n8n]

  mcp-server:
    build: ./mcp_server
    restart: unless-stopped
    ports: ["9000:9000"]
    environment:
      - MCP_DATABASE_URL=${MCP_DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_EMBED_MODEL=${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - CALENDAR_SHEET_CSV_URL=${CALENDAR_SHEET_CSV_URL}

  caddy:                   # TLS automático con Let's Encrypt sobre dominios sslip.io
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
      - MCP_DOMAIN=${MCP_DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  n8n_db:
  n8n_data:
  caddy_data:
